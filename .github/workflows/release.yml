name: Build and Release (.exe)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish WinUI 3 App
        run: >
          dotnet publish -c Release -r win-x64 -p:Platform=x64 --self-contained true
          -p:WindowsPackageType=None
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:LastFmApiKey="${{ secrets.LASTFM_API_KEY }}"
          -p:LastFmApiSecret="${{ secrets.LASTFM_API_SECRET }}"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FluentScrobbler-Setup.exe
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
