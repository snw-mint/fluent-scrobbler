name: Build and Release (.exe)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.LASTFM_API_KEY }}") -or [string]::IsNullOrWhiteSpace("${{ secrets.LASTFM_API_SECRET }}")) {
            Write-Error "LASTFM_API_KEY and LASTFM_API_SECRET are required and must not be empty."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build and Package Installers (.exe)
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            "1.2.0-ci"
          }
          $targets = @(
            @{ Rid = "win-x64"; Arch = "x64"; Platform = "x64" },
            @{ Rid = "win-arm64"; Arch = "arm64"; Platform = "ARM64" }
          )

          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          foreach ($t in $targets) {
            $rid = $t.Rid
            $arch = $t.Arch
            $platform = $t.Platform
            $outDir = "publish\$arch"

            dotnet publish -c Release -r $rid -p:Platform=$platform --self-contained true `
              -p:WindowsPackageType=None `
              -p:DebugType=none `
              -p:DebugSymbols=false `
              -p:LastFmApiKey="${{ secrets.LASTFM_API_KEY }}" `
              -p:LastFmApiSecret="${{ secrets.LASTFM_API_SECRET }}" `
              -o $outDir

            & $iscc /DMyAppVersion="$version" /DAppArch="$arch" /DSourceDir="$outDir" installer.iss
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FluentScrobbler-Setup-*.exe
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
