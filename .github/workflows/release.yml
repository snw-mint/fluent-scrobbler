name: Build and Release (.exe)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build and Package Installers (.exe)
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $targets = @(
            @{ Rid = "win-x64"; Arch = "x64"; Platform = "x64" },
            @{ Rid = "win-x86"; Arch = "x86"; Platform = "x86" },
            @{ Rid = "win-arm64"; Arch = "arm64"; Platform = "ARM64" }
          )

          foreach ($t in $targets) {
            $rid = $t.Rid
            $arch = $t.Arch
            $platform = $t.Platform
            $outDir = "publish\$arch"

            dotnet publish -c Release -r $rid -p:Platform=$platform --self-contained true `
              -p:WindowsPackageType=None `
              -p:DebugType=none `
              -p:DebugSymbols=false `
              -p:LastFmApiKey="${{ secrets.LASTFM_API_KEY }}" `
              -p:LastFmApiSecret="${{ secrets.LASTFM_API_SECRET }}" `
              -o $outDir

            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" /DAppArch="$arch" /DSourceDir="$outDir" installer.iss
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FluentScrobbler-Setup-*.exe
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
