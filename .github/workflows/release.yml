name: Build and Release (.exe)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create secrets.json
        run: |
          Set-Content -Path secrets.json -Value '{"ApiKey": "${{ secrets.LASTFM_API_KEY }}", "ApiSecret": "${{ secrets.LASTFM_API_SECRET }}"}'

      - name: Publish WinUI 3 App
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FluentScrobbler-Setup.exe
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
