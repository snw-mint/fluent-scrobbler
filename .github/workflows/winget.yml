name: Publish to WinGet

on:
  release:
    types: [published]

jobs:
  publish-winget:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: SnowMint.FluentScrobbler
          token: ${{ secrets.WINGET_TOKEN }}
